<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Each page sets its own title in the "title" block -->
  <title>{% block title %}{% endblock %} | Lucky Leo's Rescue</title>

  <!-- Fonts from Google Fonts: Lora for headings, Inter for body text -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Lora:wght@600;700&display=swap" rel="stylesheet">

  <!-- Our stylesheet, which we will write in a later step -->
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

  <!-- Header: same on every page -->
  <header class="site-header">
    <a class="logo" href="/">
      <span class="logo-icon">🍀</span>
      <span class="logo-name">Lucky Leo's Rescue</span>
    </a>
    <nav class="site-nav">
      <!-- "active_page" is sent from app.py so we can underline the current page -->
      <a href="/" class="{% if active_page == 'home' %}active{% endif %}">Home</a>
      <a href="/dogs" class="{% if active_page == 'dogs' %}active{% endif %}">Adoptable Dogs</a>
    </nav>
  </header>

  <!-- Each page puts its own content in the "content" block -->
  <main>
    {% block content %}{% endblock %}
  </main>

  <!-- Footer: same on every page -->
  <footer class="site-footer">
    <div class="footer-left">
      <span class="footer-brand">🍀 Lucky Leo's Rescue</span>
      <a href="/dogs">Adoptable Dogs</a>
    </div>
    <div class="footer-right">
      Questions? Email us at <a href="mailto:adopt@luckyleosrescue.org">adopt@luckyleosrescue.org</a>
    </div>
  </footer>

</body>
</html>
